name: Android APK

# Builds an installable APK of the game. Download it from the run's "Artifacts" section.
on:
  push:
    paths: ['js/**', 'css/**', 'fonts/**', 'icons/**', 'index.html', 'android/**', 'package*.json', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk pip.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pip-apk
          path: pip.apk
