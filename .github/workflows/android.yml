name: Android APK

# Builds an installable APK of the game on every push.
# - On main, it is also published as a GitHub Release (Releases on the repo's front page),
#   with a version number that goes up each time, so the tablet can always find the newest one.
# - On other branches, the APK is only kept as a run artifact for testing.
on:
  push:
    paths: ['js/**', 'css/**', 'fonts/**', 'icons/**', 'voice/**', 'index.html', 'android/**', 'package*.json', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - id: version
        # versionCode must go up with every build Android installs over the last one
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run android:sync
      - run: ./gradlew assembleDebug --no-daemon -PversionCode=${{ github.run_number }} -PversionName=${{ steps.version.outputs.version }}
        working-directory: android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk pip-${{ steps.version.outputs.version }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pip-apk
          path: pip-${{ steps.version.outputs.version }}.apk

  release:
    needs: apk
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the full history, to list what changed since the last release
      - uses: actions/download-artifact@v4
        with:
          name: pip-apk
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.apk.outputs.version }}
        run: |
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "## Install on the tablet"
            echo
            echo "1. On the tablet, tap **pip-$VERSION.apk** below to download it."
            echo "2. Open it and tap **Install**. The first time, Android asks you to allow installs from this browser or file app."
            echo "3. It installs over any earlier version and keeps his progress and your recordings."
            echo
            echo "## What changed"
            echo
            if [ -n "$prev" ]; then git log --no-merges --format='- %s' "$prev..HEAD"; else git log --no-merges --format='- %s'; fi
          } > notes.md
          gh release create "v$VERSION" "pip-$VERSION.apk" \
            --title "Pip and the Lost Letters $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest
